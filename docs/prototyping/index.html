<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>WaterSafety Prototyping</title>
        <link href="styles.css" rel="stylesheet">
        <script src="main.js"></script>
    </head>
    <body>
        <div class="center">
            <h1>WaterSafety Prototyping</h1>
            <p>Experiments and proofs-of-concept.</p>
            <hr />
        
            <table id="conditions">
                <tbody>
                    <tr class="measurement">
                        <td class="label">Water flow:</td>
                        <td class="value" id="water_flow"></td>
                    </tr>
                    <tr class="measurement">
                        <td class="label">Water temp:</td>
                        <td class="value" id="water_temp"></td>
                    </tr>
                    <tr class="measurement">
                        <td class="label">Water height:</td>
                        <td class="value" id="water_height"></td>
                    </tr>
                    <tr class="measurement">
                        <td class="label">CSO flag:</td>
                        <td class="value" id="cso_flag"></td>
                    </tr>
                    <tr class="measurement">
                        <td class="label">Sunrise:</td>
                        <td class="value" id="sunrise"></td>
                    </tr>
                    <tr class="measurement">
                        <td class="label">Sunset:</td>
                        <td class="value" id="sunset"></td>
                    </tr>
                    <tr class="measurement">
                        <td class="label">Visibility:</td>
                        <td class="value" id="visibility"></td>
                    </tr>
                    <tr class="measurement">
                        <td class="label">Wind:</td>
                        <td class="value" id="wind"></td>
                    </tr>
                    <tr class="measurement">
                        <td class="label">Air:</td>
                        <td class="value" id="air_temp"></td>
                    </tr>
                    <tr class="measurement">
                        <td class="label">Humidity:</td>
                        <td class="value" id="humidity"></td>
                    </tr>
                    <tr class="measurement">
                        <td class="label">AQI:</td>
                        <td class="value" id="air_quality"></td>
                    </tr>
                    <tr class="measurement">
                        <td class="label">UVI:</td>
                        <td class="value" id="uv_index"></td>
                    </tr>
                </tbody>
            </table>
        
            <hr />
            <p id="log"></p>
        </div>
    </body>
</html>
