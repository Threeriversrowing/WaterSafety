<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <title>WaterSafety Prototyping</title>
        
        <link rel="stylesheet" href="./lib/bootstrap-5.3.8-dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="./styles.css">
        
        <!-- scripts are in document.body.div#hidden-footer -->
    </head>
    <body>
        
        <div class="container">
            
            <!-- TODO: Extract navbar into component -->
            <nav id="main-nav" class="navbar position-sticky">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#"><h2>WaterSafety (Prototype)</h2></a>
                </div>
            </nav>
            
            <div class="row py-4 row-gap-3">
                
                <!-- TODO: Extract primary conditions into component -->
                <div class="col-12 col-sm-4">
                    <table id="primary-conditions" class="table table-borderless">
                        <tr class="measurement">
                            <th class="text-end w-40 align-baseline" rowspan="2">
                                <span class="label fs-4 fw-light align-baseline">Water</span>
                            </td>
                            <td>
                                <span id="water_flow" class="badge fs-4 rounded-pill fw-semibold align-baseline value"></span>
                            </td>
                        </tr>
                        <tr class="measurement">
                            <td>
                                <span id="water_temp" class="badge fs-4 rounded-pill fw-semibold align-baseline value"></span>
                            </td>
                        </tr>
                        <tr class="py-6">
                            <td colspan="2"></td>
                        </tr>
                        <tr class="measurement">
                            <td class="text-end w-40">
                                <span class="label fs-4 fw-light align-baseline">Daylight</span>
                            </td>
                            <td>
                                <span id="daylight_time" class="fs-4 text-start badge rounded-pill fw-semibold align-baseline value"></span><br />
                                <span id="daylight_note" class="fs-6 text-start badge rounded-pill fw-medium value mx-1"></span>
                            </td>
                        </tr>
                    </table>
                </div>
                
                <!-- TODO: Extract zone card into component
                <div class="col-12 col-sm-8 col-lg-4">
                    <div id="zone-card-container" class="my-2 mx-2">
                        <div id="zone-card" class="card">
                            <div class="card-header text-center fs-6 py-0 my-0">zone</div>
                            <div class="card-body text-center py-0">
                                <div class="spinner-border my-3 py-3 px-3" role="status">
                                  <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                -->
                
                <!-- TODO: Extract additional conditions into component -->
                <!-- Possibly as expanding section under primary conditions -->
                <div class="col-12 col-sm-8 col-md-6 col-lg-3">
                    <div id="additional-conditions-card" class="card">
                        <div class="card-header text-center fs-6 py-0 my-0">additional conditions</div>
                        <div class="card-body">
                            
                            <table id="conditions" class="table">
                                <tbody>
                                    <tr class="measurement">
                                        <td class="text-end w-50 label">Water height:</td>
                                        <td class="value fw-semibold" id="water_height"></td>
                                    </tr>
                                    <tr class="measurement">
                                        <td class="text-end w-50 label">CSO flag:</td>
                                        <td class="value fw-semibold" id="cso_flag"></td>
                                    </tr>
                                    <tr class="measurement">
                                        <td class="text-end w-50 label">Visibility:</td>
                                        <td class="value fw-semibold" id="visibility"></td>
                                    </tr>
                                    <tr class="measurement">
                                        <td class="text-end w-50 label">Wind:</td>
                                        <td class="value fw-semibold" id="wind"></td>
                                    </tr>
                                    <tr class="measurement">
                                        <td class="text-end w-50 label">Air:</td>
                                        <td class="value fw-semibold" id="air_temp"></td>
                                    </tr>
                                    <tr class="measurement">
                                        <td class="text-end w-50 label">Humidity:</td>
                                        <td class="value fw-semibold" id="humidity"></td>
                                    </tr>
                                    <tr class="measurement">
                                        <td class="text-end w-50 label">AQI:</td>
                                        <td class="value fw-semibold" id="air_quality"></td>
                                    </tr>
                                    <tr class="measurement">
                                        <td class="text-end w-50 label">UVI:</td>
                                        <td class="value fw-semibold" id="uv_index"></td>
                                    </tr>
                                </tbody>
                            </table>
                            
                        </div> 
                    </div>
                </div>
            </div>
            
        </div>
        <div id="hidden-footer">
            <script src="./lib/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
            <script src="./lib/popper-2.11.8-dist.js"></script>
            <!-- <script src="./lib/preact-10.23.1-dist/preact.min.js"></script> -->
            <script type="module" src="main.js"></script>
        </div>
    </body>
</html>
